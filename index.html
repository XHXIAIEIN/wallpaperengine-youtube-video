<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Background</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
               color: #fff; font: 13px/1.5 ui-monospace, Consolas, monospace; cursor: none; }
  #stage { position: fixed; top: 0; left: 0; right: 0;
           bottom: var(--safe-bottom, 0); pointer-events: none; overflow: hidden; }
  #stage video { width: 100%; height: 100%; display: block; background: #000;
                 pointer-events: none;
                 object-fit: var(--align, cover);
                 transform: translate(var(--ox, 0vw), var(--oy, 0vh))
                            scale(var(--scale, 1)); }
  #mask { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #diag { position: fixed; left: 24px; top: 24px;
          background: rgba(0,0,0,0.78);
          padding: 14px 22px; border-radius: 4px; z-index: 100;
          pointer-events: none; max-width: 70vw;
          transition: opacity .4s; color: #eee;
          font: 12px/1.65 ui-monospace, Consolas, monospace;
          display: grid; grid-template-columns: auto 1fr;
          column-gap: 14px; row-gap: 0; }
  #diag.hide { opacity: 0; }
  #diag .k  { color: #fff; font-weight: 600; text-align: right;
              white-space: nowrap; opacity: 0.95; }
  #diag .v  { color: #ddd; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  #diag .ok { color: #ddd; }
  #diag .err{ color: #ff6e6e; }
  #diag .warn{ color: #ffc168; }
</style>
</head>
<body>
<div id="stage"><video id="player" autoplay muted playsinline></video></div>
<div id="mask"></div>
<div id="diag"></div>
<script src="platforms/youtube.js"></script>
<script src="platforms/bilibili.js"></script>
<script src="platforms/vimeo.js"></script>
<script src="platforms/twitch.js"></script>
<script src="core/diagnostics.js"></script>
<script src="core/app.js"></script>
</body>
</html>
